name: Build Installers

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段，勿传 version 以免冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring 在 Windows 上汇编需要 NASM
      - name: Setup NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # ring 0.17 交叉编译 aarch64-pc-windows-msvc 需要 clang（cc 家族探测）
      - name: Setup LLVM (Windows arm64)
        if: runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          choco install -y llvm --no-progress
          echo "C:\Program Files\LLVM\bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Stage bundled harness (source + build artifacts)
        run: python scripts/stage_harness.py

      # harness 依赖已暂存进 harness-dist，node_modules 纯占磁盘（runner 仅 ~14GB）
      - name: Free disk space
        shell: bash
        run: rm -rf harness/node_modules

      - name: Build installer
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          df -h . | tail -1 | sed 's/^/::notice::disk before build: /'
          set +e
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} > build_output.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tail -60 build_output.txt
            grep -m 3 -E "error(\[E[0-9]+\])?: " build_output.txt | sed 's/^/::error::/'
            tail -6 build_output.txt | sed 's/^/::error::TAIL: /'
            exit $code
          fi

      # 失败日志走私：传到公开 Release 附件，免 Actions 权限即可排查
      - name: Upload build log on failure
        if: failure() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.6.5 "build_output.txt#log-${{ matrix.target }}.txt" --clobber --repo "$GITHUB_REPOSITORY" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuma-study-${{ matrix.target }}
          path: |
            src-tauri/target/*/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error

      # 安装包挂到 Release 页——公开仓库免登录直接下载
      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
